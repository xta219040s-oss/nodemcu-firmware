name: Build Windows Luac.Cross

on:
  workflow_dispatch:

jobs:
  build-luac:
    runs-on: windows-2022

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    # Установка и интеграция системных заголовочных файлов (исправляет ошибку stddef.h)
    - name: Integrate vcpkg (Fix C1083 / Standard Headers)
      run: |
        vcpkg integrate install

    - name: Build luac.cross for Windows
      run: |
        msbuild msvc/luac-cross/luac-cross.vcxproj `
          /t:Rebuild `
          /p:Configuration=Release `
          /p:Platform=x64 `
          /p:PlatformToolset=v143 `
          /p:WindowsTargetPlatformVersion=10.0 `
          /p:AdditionalIncludeDirectories="%WindowsSDK_IncludePath%ucrt"

    - name: Rename and Prepare Artifact
      shell: bash
      run: |
        mkdir -p bin
        # Проверка и копирование скомпилированного файла на основе структуры репозитория nodemcu
        if [ -f "msvc/luac-cross/x64/Release/luac-cross.exe" ]; then
          cp msvc/luac-cross/x64/Release/luac-cross.exe bin/luac.cross_3.0.0-release_20240225_x64_float_Lua51.exe
        elif [ -f "msvc/x64/Release/luac-cross.exe" ]; then
          cp msvc/x64/Release/luac-cross.exe bin/luac.cross_3.0.0-release_20240225_x64_float_Lua51.exe
        else
          echo "Error: luac-cross.exe not found в директориях сборки!" && exit 1
        fi

    - name: Upload Windows Executable
      uses: actions/upload-artifact@v4
      with:
        name: luac_windows_x64
        path: bin/
