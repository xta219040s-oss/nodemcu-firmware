name: Build luac.cross

on: push

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout NodeMCU firmware
        uses: actions/checkout@v4
        with:
          repository: nodemcu/nodemcu-firmware

      - name: Build luac.cross in WSL
        run: |
          wsl sudo apt update
          wsl sudo apt install -y make gcc
          wsl make luac.cross

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luac.cross
          path: luac.cross
