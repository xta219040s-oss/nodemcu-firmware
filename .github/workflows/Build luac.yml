name: Build luac.cross

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Version tag'
        required: true
        default: '3.0-test'

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        
    - name: Build luac.cross.exe
      run: |
        cd nodemcu-firmware\msvc
        echo "Building in: %CD%"
        dir
        msbuild hosttools.sln /p:Configuration=Release /p:Platform=x64
        copy luac-cross\x64\Release\luac.cross.exe ..
      shell: cmd
      
    - name: Upload luac.cross
      uses: actions/upload-artifact@v4
      with:
        name: luac.cross_${{ github.event.inputs.tag_name }}_x64_float_Lua51
        path: nodemcu-firmware\luac.cross.exe
