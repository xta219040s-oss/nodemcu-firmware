name: my build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LUA: 51

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - run: pip install pyserial
    
    # Добавляем пакет gcc-mingw-w64-x86-64 для сборки под Windows x64
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y srecord gcc-mingw-w64-x86-64

    - name: Build NodeMCU firmware
      run: |
        make clean
        make

    # Собираем luac.cross под Windows x64
    - name: Build luac.cross for Windows
      run: |
        make -C app/lua/luac.cross CC=x86_64-w64-mingw32-gcc
        # Переименовываем файл в соответствии с вашими требованиями
        mv app/lua/luac.cross/luac.cross.exe bin/luac.cross_3.0.0-release_20240225_x64_float_Lua51.exe

    - name: Upload artifacts
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: firmware_and_luac
        path: bin
